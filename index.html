<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image to PDF Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        .drop-zone--over { border-color: #3b82f6; background-color: #eff6ff; }
        .preview-img { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <div class="max-w-4xl mx-auto py-12 px-4">
        <!-- Header -->
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-slate-800 mb-2">VisionPDF <span class="text-blue-600">AI</span></h1>
            <p class="text-slate-500">Fast, secure, and client-side image to PDF conversion.</p>
        </div>

        <!-- Main Card -->
        <div class="bg-white rounded-2xl shadow-xl p-8">
            
            <!-- Upload Area -->
            <div id="dropZone" class="border-2 border-dashed border-slate-300 rounded-xl p-10 text-center transition-all cursor-pointer hover:border-blue-400">
                <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
                <div class="flex flex-col items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-blue-500 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    <p class="text-lg font-medium text-slate-700">Drag & drop images or <span class="text-blue-600">browse</span></p>
                    <p class="text-sm text-slate-400 mt-1">Supports JPG, PNG, WEBP</p>
                </div>
            </div>

            <!-- Preview Section -->
            <div id="previewContainer" class="mt-8 hidden">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-semibold text-slate-800">Selected Images (<span id="count">0</span>)</h3>
                    <button id="clearAll" class="text-red-500 hover:text-red-700 text-sm font-medium">Clear All</button>
                </div>
                <div id="imageList" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                    <!-- Images will be injected here -->
                </div>

                <!-- Settings -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 p-6 bg-slate-50 rounded-xl mb-8">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Page Size</label>
                        <select id="pageSize" class="w-full p-2 border border-slate-300 rounded-md">
                            <option value="a4">A4 (Standard)</option>
                            <option value="letter">Letter</option>
                            <option value="fit">Fit to Image Size</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Margin (mm)</label>
                        <input type="number" id="margin" value="10" min="0" class="w-full p-2 border border-slate-300 rounded-md">
                    </div>
                </div>

                <!-- Convert Button -->
                <button id="convertBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg transition-transform active:scale-95 flex justify-center items-center gap-2">
                    <span>Generate PDF</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                </button>
            </div>
        </div>

        <footer class="mt-12 text-center text-slate-400 text-sm">
            Powered by jsPDF Library • Processed locally for privacy.
        </footer>
    </div>

    <script>
        const { jsPDF } = window.jspdf;
        let selectedFiles = [];

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const imageList = document.getElementById('imageList');
        const previewContainer = document.getElementById('previewContainer');
        const countSpan = document.getElementById('count');

        // Trigger file input
        dropZone.addEventListener('click', () => fileInput.click());

        // Handle File Selection
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        // Drag and Drop Logic
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drop-zone--over');
        });

        ['dragleave', 'drop'].forEach(event => {
            dropZone.addEventListener(event, () => dropZone.classList.remove('drop-zone--over'));
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            handleFiles(e.dataTransfer.files);
        });

        function handleFiles(files) {
            const filesArray = Array.from(files);
            selectedFiles = [...selectedFiles, ...filesArray];
            renderPreviews();
        }

        function renderPreviews() {
            imageList.innerHTML = '';
            if (selectedFiles.length > 0) {
                previewContainer.classList.remove('hidden');
                countSpan.innerText = selectedFiles.length;
                
                selectedFiles.forEach((file, index) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const div = document.createElement('div');
                        div.className = 'relative group';
                        div.innerHTML = `
                            <img src="${e.target.result}" class="preview-img border shadow-sm">
                            <button onclick="removeFile(${index})" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                        `;
                        imageList.appendChild(div);
                    }
                    reader.readAsDataURL(file);
                });
            } else {
                previewContainer.classList.add('hidden');
            }
        }

        window.removeFile = (index) => {
            selectedFiles.splice(index, 1);
            renderPreviews();
        };

        document.getElementById('clearAll').addEventListener('click', () => {
            selectedFiles = [];
            renderPreviews();
        });

        // PDF Generation Logic
        document.getElementById('convertBtn').addEventListener('click', async () => {
            const btn = document.getElementById('convertBtn');
            btn.innerText = "Processing...";
            btn.disabled = true;

            const pdf = new jsPDF();
            const margin = parseInt(document.getElementById('margin').value);
            const format = document.getElementById('pageSize').value;

            for (let i = 0; i < selectedFiles.length; i++) {
                const imgData = await readFileAsDataURL(selectedFiles[i]);
                const imgProps = pdf.getImageProperties(imgData);
                
                let width = pdf.internal.pageSize.getWidth() - (margin * 2);
                let height = (imgProps.height * width) / imgProps.width;

                // Create new page if not first image
                if (i > 0) pdf.addPage();
                
                pdf.addImage(imgData, 'JPEG', margin, margin, width, height);
            }

            pdf.save("converted-document.pdf");
            btn.innerHTML = `<span>Generate PDF</span>`;
            btn.disabled = false;
        });

        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }
    </script>
</body>
</html>
